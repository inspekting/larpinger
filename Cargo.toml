[package]
name = "larpinger"
version = "0.1.0"
edition = "2021"
description = "Multi-protocol ping for ICMP, TCP and UDP — subnets, custom ports, continuous live TUI"
license = "MIT"
keywords = ["ping", "icmp", "tcp", "udp", "network", "tui"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "larpinger"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
socket2 = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
